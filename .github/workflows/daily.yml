name: ETF Daily Monitor

on:
  schedule:
    - cron: '35 7 * * 1-5'   # 北京时间 15:35（UTC 07:35），周一至周五，收盘后
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install akshare==1.20.2 pandas==3.1.0 numpy==2.5.4 requests==2.34.2

      - name: Download ECharts
        run: |
          mkdir -p libs
          curl -fsSL -o libs/echarts.min.js https://unpkg.com/echarts@5.5.1/dist/echarts.min.js

      - name: Run monitor
        run: python etf_monitor.py --cloud

      - name: Commit valuation history
        run: |
          git config user.name "etf-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/valuation_history.csv output/run_log.txt output/etf_dashboard.html
          git diff --cached --quiet || git commit -m "daily update: $(date +%F)"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p deploy
          cp -r output deploy/output
          cp -r libs deploy/libs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
